# Research State — Central Project Tracking

project:
  title: "Operator-Level Inference Acceleration for Pruned SkateFormer"
  question: "How can the current pruned SkateFormer implementation be accelerated through mathematically equivalent operator rewrites, without requiring full retraining?"
  status: active
  started: "2026-07-28"
  domain: "computer vision, skeleton-based action recognition, inference optimization"

literature:
  key_papers:
    - "Pan et al., On the Integration of Self-Attention and Convolution (CVPR 2022, arXiv:2111.14556)"
    - "SkateFormer: Skeletal-Temporal Transformer for Human Action Recognition"
  open_problems:
    - "How much latency can be removed by exact operator rewrites alone under `B=1, C=192, T=64, V=14`."
    - "Whether `cat + proj` can be rewritten cleanly as a sum of branch-wise projections in the current implementation."
    - "Whether channel-first `1x1 Conv` rewrites outperform the current channel-last `Linear` layout path."
    - "Whether fused graph operations provide measurable benefit under low-batch inference."
  evidence_gaps:
    - "No operator-only benchmark table has yet been logged for the new branch."
    - "No numerical-equivalence table has yet been logged for the proposed rewrites."
    - "No cumulative speedup result exists from composing exact rewrites."

hypotheses:
  - id: H0
    statement: "The main short-term acceleration opportunity is implementation-level operator rewriting rather than a new train-from-scratch block design."
    status: active
    motivation: "Training budget is constrained, so the branch should prioritize acceleration that can be verified without retraining."
    parent: null
    priority: high
  - id: H1
    statement: "The existing `cat + proj` path can be algebraically rewritten as a sum of branch-specific projections while preserving the same function."
    status: active
    motivation: "This removes explicit concatenation from the hot path without changing model semantics."
    parent: null
    priority: high
  - id: H2
    statement: "Channel-last `Linear` paths can be replaced with channel-first `1x1 Conv2d` equivalents and reduce layout overhead."
    status: active
    motivation: "A large fraction of current layout conversion exists only to feed `Linear` and `LayerNorm` in channel-last form."
    parent: null
    priority: high
  - id: H3
    statement: "The current graph branch loop can be fused into a larger batched operation with measurable inference benefit."
    status: active
    motivation: "Low-batch inference is sensitive to many small Python-driven tensor ops."
    parent: null
    priority: medium
  - id: H4
    statement: "Operator-level benchmark conclusions must be drawn from the real pruned target regime, not generic large-batch settings."
    status: active
    motivation: "The branch is specifically about low-`V`, low-batch inference."
    parent: null
    priority: medium

