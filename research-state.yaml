# Research State — Central Project Tracking

project:
  title: "ACmix-Inspired Compute Acceleration for SkateFormer-Based Skeleton Action Recognition"
  question: "How can SkateFormer be redesigned to reduce real inference cost while preserving strong full-sequence recognition accuracy on standard skeleton benchmarks?"
  status: active
  started: "2026-07-27"
  domain: "computer vision, skeleton-based action recognition, model acceleration"

literature:
  key_papers:
    - "Pan et al., On the Integration of Self-Attention and Convolution (CVPR 2022, arXiv:2111.14556)"
    - "SkateFormer: Skeletal-Temporal Transformer for Human Action Recognition"
  open_problems:
    - "Which part of the current SkateFormer block dominates real latency under the repository's benchmark path."
    - "How far ACmix-style shared projection can be adapted to skeleton temporal-joint tokens without hurting accuracy."
    - "Whether stage-wise replacement yields a better Pareto frontier than an all-stage rewrite."
    - "Whether FLOPs savings will translate to real latency savings once partition and memory-movement overhead is included."
    - "Whether the stronger paper direction is a block-level redesign that removes explicit partition and concat-projection structure, rather than a narrow operator optimization."
  evidence_gaps:
    - "No fresh baseline latency table has been logged under the new branch definition."
    - "No module-level profile has yet separated `mapping`, `proj`, `mlp`, and partitioned attention overhead."
    - "No ACmix-style skeleton block has yet been implemented or benchmarked in this branch."
    - "No matched XView validation exists for the new acceleration line."

hypotheses:
  - id: H0
    statement: "If the accuracy path and inference benchmark are frozen before architecture changes, later acceleration claims will remain fair and interpretable."
    status: active
    motivation: "Batch size, device, input shape, warmup, and checkpoint quality can easily drift and invalidate speed comparisons."
    parent: null
    priority: high
  - id: H1
    statement: "An ACmix-style shared-projection redesign can reduce compute while preserving competitive SkateFormer accuracy."
    status: active
    motivation: "The current block already mixes several aggregation paths, so the main opportunity is to reduce how much expensive channel mixing is done around them."
    parent: null
    priority: high
  - id: H2
    statement: "Partial stage replacement will outperform full-model replacement on the first acceleration Pareto frontier."
    status: active
    motivation: "Different stages likely have different sensitivity to long-range modeling and local aggregation."
    parent: null
    priority: high
  - id: H3
    statement: "Teacher-guided recovery will be a cheaper accuracy-repair path than reintroducing heavy modules."
    status: active
    motivation: "The branch objective is acceleration, so accuracy repair should stay lightweight."
    parent: null
    priority: medium
  - id: H4
    statement: "A useful acceleration claim must survive both FLOPs accounting and wall-clock latency measurement."
    status: active
    motivation: "Implementation overhead can erase theoretical savings."
    parent: null
    priority: medium
  - id: H5
    statement: "For pruned low-V inference, a partition-free and branch-collapsed block redesign is more defensible as the main research contribution than isolated operator tuning."
    status: active
    motivation: "The paper-worthy problem is likely the block organization itself: explicit partition, branch materialization, and concat-projection fusion."
    parent: null
    priority: high

