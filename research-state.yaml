# Research State — Central Project Tracking

project:
  title: "Early Skeleton Action Recognition with Coarse Intent Supervision and Long-Short Sequence Consistency"
  question: "How can a skeleton-based action-recognition model make reliable early predictions from partial prefixes, especially at low observation ratios, without frame-level stage annotation or heavy sub-action modeling?"
  status: active
  started: "2026-05-06"
  domain: "computer vision, skeleton-based action recognition, early action recognition"

literature:
  key_papers: []
  open_problems:
    - "Whether coarse intent labels provide real low-ratio gains or only act as generic auxiliary supervision."
    - "Whether full-prefix consistency provides unique value beyond straightforward KD-only baselines."
    - "How much value remains in manual coarse-intent grouping once semantic, trajectory, and early-observable taxonomies all fail to beat `prefix_multi` at `0.1 / 0.3`."
  evidence_gaps:
    - "No clean KD-only baseline has yet been logged under the locked NTU60 early protocol."
    - "No consistency-only run has yet separated full-to-prefix guidance from plain distillation."
    - "The adaptive gated intent-improved line has only been checked at `0.1 / 0.3 / 0.5`; the fixed-taxonomy comparison is now saturated through `early_observable_v2`, but the mechanism-improved row is still partial."
    - "No XView validation has yet checked whether the XSub baseline story transfers."

hypotheses:
  - id: H0
    statement: "If the early-recognition protocol is frozen before major experiments, later comparisons will remain fair and interpretable."
    status: supported
    motivation: "Prefix cropping, valid-frame counting, interpolation, and ratio scheduling can easily drift and invalidate comparisons."
    parent: null
    priority: high
  - id: H1
    statement: "Coarse intent labels provide more stable supervision than fine action labels in the low-observation regime and can improve early skeleton recognition."
    status: challenged
    motivation: "Many classes remain ambiguous early but are already separable at a coarser semantic level."
    parent: null
    priority: high
  - id: H2
    statement: "A full-sequence branch used as a training-time consistency target can stabilize prefix predictions and improve low-ratio performance."
    status: active
    motivation: "Partial prefixes underdetermine the final class, so full-sequence guidance may regularize the prediction boundary."
    parent: null
    priority: high
  - id: H3
    statement: "The combined intent-plus-consistency model will matter most at 0.1 and 0.3 observation ratios."
    status: active
    motivation: "The method is only meaningful if it solves the genuinely early regime rather than near-complete observation."
    parent: null
    priority: medium
  - id: H4
    statement: "The main claim will remain valid under multiple coarse-intent grouping schemes."
    status: active
    motivation: "Manual taxonomy design must not become the hidden source of the result."
    parent: null
    priority: medium

experiments:
  proxy_metric: "Per-ratio Top-1 action accuracy under a fixed early-recognition protocol on NTU60."
  baseline_value:
    prefix_single_r01_top1: 27.66
    prefix_single_r03_top1: 67.04
  best_value:
    prefix_multi_r01_top1: 31.88
    prefix_multi_r03_top1: 68.92
    prefix_multi_mean_top1: 76.56
    full_upper_bound_top1: 91.73
  total_runs: 8
  trajectory:
    - "SkateFormer-full (`1.0 -> 1.0`) reached 91.73% Top-1 on NTU60 XSub."
    - "Single-ratio prefix baseline at `r=0.3` reached 67.04% Top-1."
    - "Single-ratio prefix rerun at `r=0.1` reached 27.66% Top-1."
    - "Multi-ratio prefix baseline reached 31.88% / 68.92% / 85.52% / 90.17% / 91.44% / 91.42% Top-1 over `0.1 / 0.3 / 0.5 / 0.7 / 0.9 / 1.0`."
    - "Intent-only under `semantic_coarse_v1` reached 31.69% / 67.95% / 85.35% / 90.08% / 91.11% / 91.41% Top-1 and did not beat `prefix_multi` at any tested ratio."
    - "Intent-only under `trajectory_coarse_v1` reached 31.32% / 68.37% / 85.42% / 90.08% / 91.25% / 91.54% Top-1, modestly improving over the semantic mapping but still trailing `prefix_multi` at `0.1 / 0.3`."
    - "Intent-only under `early_observable_v2` reached 31.53% / 68.33% / 85.46% / 90.27% / 91.39% / 91.55% Top-1; it is the best fixed intent taxonomy tried so far on average, but still does not beat `prefix_multi` at `0.1 / 0.3`."
    - "Intent-improved with trajectory mapping, ratio-adaptive intent weights, and intent-to-action bias/gating reached 31.30% / 68.48% / 85.53% Top-1 at `0.1 / 0.3 / 0.5`; it gave small mid-ratio gains over fixed trajectory intent-only but still did not beat `prefix_multi` at `0.1 / 0.3`."

outer_loop:
  cycle: 1
  last_direction: "stress_test_intent_then_shift_to_teacher_guidance"
  last_reflection: "The intent line is now saturated enough to stop taxonomy-first iteration. Semantic intent-only was weakest, trajectory intent-only was directionally better, and `early_observable_v2` is now the best fixed taxonomy on average, but all fixed intent rows still miss `prefix_multi` at `0.1 / 0.3`. The adaptive gated refinement only adds small mid-ratio gains and remains partial. The next priority is therefore clearly KD-only and consistency-only."

plan:
  primary_benchmark:
    name: "NTU60 early skeleton action recognition"
    status: locked_for_current_phase
    note: "Use XSub first, then XView. NTU120 is deferred until the NTU60 story is stable."
  secondary_benchmark:
    name: "NTU120 early extension"
    status: deferred
    note: "This is a later robustness study, not part of the current baseline-lock phase."
  current_phase: "H2_single-module-ablation"
  plan_document: "research-plan.md"
  milestones:
    - "Freeze prefix construction and observation-ratio protocol. (done)"
    - "Build the SkateFormer-prefix baseline. (done on XSub for `r=0.1`, `r=0.3`, and multi-ratio)"
    - "Validate intent-only, consistency-only, and KD-only separately. (intent-only complete; KD-only and consistency-only pending)"
    - "Train and evaluate the full joint model."
    - "Stress-test the claim under multiple intent mappings and XView."
  next_actions:
    - "Implement and run KD-only under the locked NTU60 XSub early-recognition protocol."
    - "Run consistency-only and keep the naming honest if it reduces to ordinary KD."
    - "Use the completed semantic, trajectory, `early_observable_v2`, and adaptive-gated intent rows as the intent reference set."
    - "Only if teacher-guided baselines show value, continue to uncertainty-aware consistency rather than another intent-taxonomy tweak."
    - "Defer XView and NTU120 until the simpler H2 gain sources are separated cleanly."

