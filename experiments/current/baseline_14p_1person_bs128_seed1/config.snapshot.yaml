# Batch-128 protocol: all LR endpoints scaled 4x from the batch-32 run.
# NTU60 XSub full-sequence baseline, original SkateFormer blocks.
# Joint IDs are 1-based NTU25 IDs from historical pruning scheme 10.
# New matched baseline; not a reproduction of the historical 94.23%.
seed: 1
num_worker: 10
work_dir: ./work_dir/acceleration/baseline_14p_1person_bs128_seed1

phase: train
weights: null

# feeder  python main.py --config ./config/train/acceleration/baseline_14p_1person.yaml
feeder: feeders.feeder_ntu.Feeder
train_feeder_args:
  data_path: ./data/ntu/NTU60_CS.npz
  split: train
  debug: False
  window_size: 64
  p_interval: [0.5, 1]
  aug_method: a123489
  intra_p: 0.5
  inter_p: 0.2
  thres: 64
  uniform: True
  # Physically select 14 joints; retain the first person.
  partition: False
  joint_indices: [2, 3, 4, 5, 6, 8, 9, 10, 12, 15, 16, 19, 20, 21]
  num_people: 1

test_feeder_args:
  data_path: ./data/ntu/NTU60_CS.npz
  split: test
  window_size: 64
  p_interval: [0.95]
  thres: 64
  uniform: True
  # Physically select 14 joints; retain the first person.
  partition: False
  joint_indices: [2, 3, 4, 5, 6, 8, 9, 10, 12, 15, 16, 19, 20, 21]
  num_people: 1
  debug: False

# model
model: model.SkateFormer.SkateFormer_
model_args:
  block_type: skateformer
  num_classes: 60
  num_people: 1
  num_points: 14
  kernel_size: 7
  num_heads: 32
  attn_drop: 0.5
  head_drop: 0.0
  rel: True
  drop_path: 0.2
  type_1_size: [8, 7]
  type_2_size: [8, 7]
  type_3_size: [8, 7]
  type_4_size: [8, 7]
  mlp_ratio: 4.0
  index_t: True

#optim
optimizer: AdamW
weight_decay: 0.1
lr_scheduler: cosine
base_lr: 1.0e-3
min_lr: 1.0e-5
warmup_lr: 1.0e-7
warmup_prefix: False
warm_up_epoch: 25

# training
device: [0]
batch_size: 128
test_batch_size: 128
num_epoch: 500
nesterov: True
grad_clip: True
grad_max: 1.0
loss_type: LSCE

